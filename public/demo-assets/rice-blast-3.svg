<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4d6f3e"/>
      <stop offset="100%" stop-color="#22391b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg3)"/>

  <!-- Panicle Stem Nodes -->
  <path d="M 400,600 Q 420,300 480,100" fill="none" stroke="#7aa34c" stroke-width="14"/>
  
  <!-- Panicle grains / seeds branching -->
  <g stroke="#9bbd66" stroke-width="4" stroke-linecap="round">
    <line x1="420" y1="360" x2="490" y2="330"/>
    <line x1="435" y1="310" x2="360" y2="280"/>
    <line x1="450" y1="260" x2="520" y2="220"/>
    <line x1="465" y1="200" x2="390" y2="170"/>
    <line x1="480" y1="140" x2="530" y2="100"/>
  </g>

  <!-- Node Blast Blackening -->
  <ellipse cx="423" cy="355" rx="16" ry="10" fill="#2b1406"/>
  <ellipse cx="423" cy="355" rx="22" ry="14" fill="#542e12" opacity="0.6"/>

  <g transform="translate(30, 30)">
    <rect width="260" height="48" rx="8" fill="#000000" opacity="0.6"/>
    <circle cx="25" cy="24" r="8" fill="#3b82f6"/>
    <text x="45" y="24" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">PHOTO 3: PANICLE / NODE VIEW</text>
    <text x="45" y="40" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Blackened Node Stem Infection</text>
  </g>
</svg>