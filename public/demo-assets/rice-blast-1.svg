<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d5a27"/>
      <stop offset="50%" stop-color="#1f441b"/>
      <stop offset="100%" stop-color="#152f12"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73a942"/>
      <stop offset="50%" stop-color="#538d22"/>
      <stop offset="100%" stop-color="#3b691a"/>
    </linearGradient>
    <radialGradient id="lesion" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8d8c8"/>
      <stop offset="40%" stop-color="#b07d4b"/>
      <stop offset="80%" stop-color="#703816"/>
      <stop offset="100%" stop-color="#381b0a"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Field Foliage Background -->
  <path d="M -50,650 Q 200,200 450,650" fill="none" stroke="#254e1f" stroke-width="60" opacity="0.6"/>
  <path d="M 350,650 Q 600,180 850,650" fill="none" stroke="#2c5c24" stroke-width="70" opacity="0.5"/>

  <!-- Main Focus Rice Leaf Blade -->
  <g filter="url(#shadow)">
    <path d="M 120,580 Q 380,260 720,120 Q 560,340 240,590 Z" fill="url(#leafGrad)"/>
    <!-- Leaf veins -->
    <path d="M 180,585 Q 470,300 720,120" fill="none" stroke="#8ec857" stroke-width="3" opacity="0.8"/>
    <path d="M 280,480 Q 320,440 370,455" fill="none" stroke="#8ec857" stroke-width="1.5" opacity="0.7"/>
    <path d="M 360,400 Q 400,360 450,375" fill="none" stroke="#8ec857" stroke-width="1.5" opacity="0.7"/>
    <path d="M 440,320 Q 480,280 530,295" fill="none" stroke="#8ec857" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Spindle-shaped Rice Blast Lesions (Magnaporthe oryzae) -->
  <g filter="url(#shadow)">
    <!-- Primary Spindle Lesion -->
    <ellipse cx="430" cy="340" rx="65" ry="24" transform="rotate(-30 430 340)" fill="url(#lesion)"/>
    <ellipse cx="430" cy="340" rx="42" ry="14" transform="rotate(-30 430 340)" fill="#e5ded6" opacity="0.9"/>
    <!-- Yellow Chlorotic Halo -->
    <ellipse cx="430" cy="340" rx="76" ry="32" transform="rotate(-30 430 340)" fill="none" stroke="#ffeb3b" stroke-width="4" opacity="0.7"/>

    <!-- Secondary Lesion 1 -->
    <ellipse cx="320" cy="440" rx="45" ry="16" transform="rotate(-34 320 440)" fill="url(#lesion)"/>
    <ellipse cx="320" cy="440" rx="28" ry="9" transform="rotate(-34 320 440)" fill="#ded4c8" opacity="0.85"/>
    <ellipse cx="320" cy="440" rx="52" ry="22" transform="rotate(-34 320 440)" fill="none" stroke="#ffeb3b" stroke-width="3" opacity="0.6"/>

    <!-- Secondary Lesion 2 -->
    <ellipse cx="530" cy="245" rx="50" ry="18" transform="rotate(-28 530 245)" fill="url(#lesion)"/>
    <ellipse cx="530" cy="245" rx="32" ry="10" transform="rotate(-28 530 245)" fill="#e8dacf" opacity="0.85"/>
    <ellipse cx="530" cy="245" rx="58" ry="24" transform="rotate(-28 530 245)" fill="none" stroke="#ffeb3b" stroke-width="3" opacity="0.6"/>

    <!-- Small necrotic spots -->
    <circle cx="260" cy="500" r="7" fill="#5a2e12"/>
    <circle cx="370" cy="390" r="6" fill="#5a2e12"/>
    <circle cx="590" cy="190" r="8" fill="#5a2e12"/>
  </g>

  <!-- Specimen Photo Label Badge -->
  <g transform="translate(30, 30)">
    <rect width="260" height="48" rx="8" fill="#000000" opacity="0.6"/>
    <circle cx="25" cy="24" r="8" fill="#ef4444"/>
    <text x="45" y="24" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">PHOTO 1: SYMPTOM CLOSE-UP</text>
    <text x="45" y="40" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Rice Blast (Spindle Leaf Lesions)</text>
  </g>
</svg>